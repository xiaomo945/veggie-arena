<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>竞技场生存 · 手机版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#0d0b0a;color:#efe7dc;height:100%;overflow:hidden;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #wrap{display:flex;align-items:center;justify-content:center;height:100dvh;padding:2px}
  canvas{display:block;border-radius:10px;touch-action:none;-webkit-user-drag:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
// ============================================================
// 竞技场生存（土豆兄弟 Brotato 式）
//   摇杆跑位 + 武器自动开火 + 波次刷怪 + 补给站买装备养成
//   装备机制：6 个武器槽挂在角色身边转圈 / 同类武器可合成升级 / 5 种属性强化
// ============================================================
const W=540, H=900;
const AR={x:12,y:74,w:516,h:756};        // 竞技场（四面八方刷怪的框）
const MAXSLOT=6, MAXLV=4;

// ---------------- 武器表 ----------------
const WEAPONS=[
  {key:'pistol', zh:'手枪',   dmg:9, cd:.42,range:300,spd:560,pellets:1,spread:0,  pierce:0,aoe:0, cost:12,c:'#f7d24e',
   tip:'稳定的单体输出，开局自带'},
  {key:'smg',    zh:'冲锋枪', dmg:5, cd:.13,range:260,spd:620,pellets:1,spread:.14,pierce:0,aoe:0, cost:18,c:'#8fd482',
   tip:'射速极快，清小怪'},
  {key:'shotgun',zh:'霰弹枪', dmg:8, cd:.95,range:210,spd:500,pellets:4,spread:.34,pierce:0,aoe:0, cost:20,c:'#e79ada',
   tip:'一次 4 发，贴脸伤害高'},
  {key:'bow',    zh:'长弓',   dmg:18,cd:.80,range:360,spd:700,pellets:1,spread:0,  pierce:2,aoe:0, cost:22,c:'#6fa8e0',
   tip:'穿透 2 个敌人，打直线'},
  {key:'staff',  zh:'法杖',   dmg:14,cd:1.0,range:320,spd:460,pellets:1,spread:0,  pierce:0,aoe:52,cost:26,c:'#b0aad0',
   tip:'命中炸开一片，群怪好用'},
  {key:'rocket', zh:'火箭筒', dmg:40,cd:1.8,range:360,spd:400,pellets:1,spread:0,  pierce:0,aoe:86,cost:34,c:'#e06a6a',
   tip:'大范围爆炸，慢但狠'},
];
// ---------------- 强化表 ----------------
const UPGRADES=[
  {key:'hp',  zh:'最大生命 +15', cost:14, tip:'血条更长，立刻补满这 15 点',
   apply:()=>{P.maxHp+=15;P.hp=Math.min(P.maxHp,P.hp+15);}},
  {key:'spd', zh:'移动速度 +8%', cost:12, tip:'跑得快 = 更难被围住',
   apply:()=>{S.spd+=.08;}},
  {key:'dmg', zh:'伤害 +10%',    cost:16, tip:'所有武器伤害一起提升',
   apply:()=>{S.dmg+=.10;}},
  {key:'rate',zh:'攻速 +8%',     cost:16, tip:'所有武器射速一起提升',
   apply:()=>{S.rate+=.08;}},
  {key:'arm', zh:'护甲 +2',      cost:18, tip:'每次被撞到的伤害 -2',
   apply:()=>{S.arm+=2;}},
  {key:'pick',zh:'拾取范围 +30%',cost:8,  tip:'金币自动吸过来的范围变大',
   apply:()=>{S.pick+=.30;}},
  {key:'heal',zh:'立刻回复 40 生命',cost:10, tip:'残血时的救命稻草',
   apply:()=>{P.hp=Math.min(P.maxHp,P.hp+40);}},
];

let P,S,weapons,enemies,bullets,coins,floats,rings,trail;
let wave,waveT,waveLen,state,gold,spawnAcc,offers,kills,rrCount;
let joy=null,keys={},tick=0,trailAcc=0;

// 手感参数：JR=摇杆半径 JD=死区 K1=顺向 K2=反向急转
// 手指本身就是连续输入，不需要重平滑：K=90 → 到 90% 速度只要 26ms，
// 加一帧渲染 ≈ 42ms，低于人眼感知阈值（50-80ms），同时还能滤掉手指抖动
const JR=52, JD=3, K1=90, K2=110;

function reset(){
  P={x:AR.x+AR.w/2, y:AR.y+AR.h/2, r:16, hp:100, maxHp:100, baseSpd:180, ifr:0, vx:0, vy:0};
  S={spd:0,dmg:0,rate:0,pick:0,arm:0};
  weapons=[{...WEAPONS[0], lv:1, cdL:0}];     // 开局送 1 把手枪
  enemies=[];bullets=[];coins=[];floats=[];rings=[];trail=[];trailAcc=0;
  wave=1;waveT=0;waveLen=20;state='start';gold=0;spawnAcc=0;kills=0;rrCount=0;
  joy=null;
}
const spd=()=>P.baseSpd*(1+S.spd);
const pickupR=()=>58*(1+S.pick);

// ---------------- 敌人 ----------------
function spawnEnemy(){
  if(enemies.length>88) return;
  const r=Math.random(); let t='grunt';
  if(wave>=2 && r<.28) t='fast';
  if(wave>=3 && r>(wave>=6?.82:.88)) t='tank';
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=AR.x+Math.random()*AR.w; y=AR.y-20;}
  else if(side===1){x=AR.x+Math.random()*AR.w; y=AR.y+AR.h+20;}
  else if(side===2){x=AR.x-20; y=AR.y+Math.random()*AR.h;}
  else{x=AR.x+AR.w+20; y=AR.y+Math.random()*AR.h;}
  let d;
  if(t==='grunt')      d={hp:8+wave*4.5, spd:48+wave*1.8, dmg:4+wave*.7, r:14,gold:1,c:'#e0605f'};
  else if(t==='fast')  d={hp:5+wave*2.6, spd:96+wave*2.2, dmg:3+wave*.5, r:11,gold:1,c:'#ef9a4a'};
  else                 d={hp:26+wave*11, spd:30+wave*.7,  dmg:9+wave*1.3,r:23,gold:3,c:'#9a7ad0'};
  enemies.push({x,y,t,hp:d.hp,maxHp:d.hp,spd:d.spd,dmg:d.dmg,r:d.r,gold:d.gold,c:d.c,
    hitT:0,touchCd:0,spawnT:.45,dead:false});
}
function spawnRate(){ return Math.min(4.6, .55+wave*.30); }

// ---------------- 开火 ----------------
function nearestEnemy(range){
  let best=null,bd=range*range;
  for(const e of enemies){
    if(e.spawnT>0) continue;
    const dx=e.x-P.x,dy=e.y-P.y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function fire(w){
  const tgt=nearestEnemy(w.range); if(!tgt) return;
  const n=w.pellets||1;
  for(let i=0;i<n;i++){
    let ang=Math.atan2(tgt.y-P.y,tgt.x-P.x);
    if(w.spread) ang+=(Math.random()-.5)*w.spread*2;
    bullets.push({x:P.x,y:P.y,vx:Math.cos(ang)*w.spd,vy:Math.sin(ang)*w.spd,
      dmg:w.dmg*(1+S.dmg),pierce:w.pierce||0,aoe:w.aoe||0,r:w.aoe?7:4,
      c:w.c,life:1.4,hit:[]});
  }
  rings.push({x:P.x,y:P.y,r:8,max:22,c:w.c,life:.16});
}

// ---------------- 逻辑步进 ----------------
function step(dt){
  tick+=dt;
  if(state!=='play') return;

  // 玩家移动：目标方向 → 速度插值（反向时收敛更快，变向不拖泥带水）
  let tx=0,ty=0;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);
    if(l>JD){tx=dx/l;ty=dy/l;}}
  if(keys.l)tx-=1; if(keys.r)tx+=1; if(keys.u)ty-=1; if(keys.d)ty+=1;
  const tl=Math.hypot(tx,ty); if(tl>1){tx/=tl;ty/=tl;}
  const dot=P.vx*tx+P.vy*ty;
  const acc=1-Math.exp(-(dot<0?K2:K1)*dt);      // 反向=急停急转，顺向=平滑加速
  P.vx+=(tx*spd()-P.vx)*acc; P.vy+=(ty*spd()-P.vy)*acc;
  if(Math.abs(P.vx)<2)P.vx=0; if(Math.abs(P.vy)<2)P.vy=0;
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  if(P.x<AR.x+P.r){P.x=AR.x+P.r; P.vx=0;}
  if(P.x>AR.x+AR.w-P.r){P.x=AR.x+AR.w-P.r; P.vx=0;}
  if(P.y<AR.y+P.r){P.y=AR.y+P.r; P.vy=0;}
  if(P.y>AR.y+AR.h-P.r){P.y=AR.y+AR.h-P.r; P.vy=0;}
  // 跑动残影（让变向看得见）
  trailAcc+=dt;
  if(Math.hypot(P.vx,P.vy)>60 && trailAcc>.04){
    trailAcc=0; trail.push({x:P.x,y:P.y,life:.26});
  }
  trail.forEach(t=>t.life-=dt); trail=trail.filter(t=>t.life>0);

  // 武器自动开火（每把武器独立冷却）
  for(const w of weapons){
    w.cdL-=dt*(1+S.rate);
    if(w.cdL<=0){ fire(w); w.cdL=w.cd; }
  }

  // 刷怪：四面八方
  spawnAcc+=dt*spawnRate();
  while(spawnAcc>=1){ spawnAcc-=1; spawnEnemy(); }

  // 敌人追击 + 接触伤害（0.38s 无敌帧，防止被围住瞬间撕裂）
  P.ifr=Math.max(0,P.ifr-dt);
  for(const e of enemies){
    e.hitT=Math.max(0,e.hitT-dt); e.touchCd=Math.max(0,e.touchCd-dt);
    if(e.spawnT>0){ e.spawnT-=dt; continue; }
    const dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;
    e.x+=dx/l*e.spd*dt; e.y+=dy/l*e.spd*dt;
    if(l<e.r+P.r && e.touchCd<=0 && P.ifr<=0){
      P.ifr=.38; e.touchCd=.7;
      const d=Math.max(1,Math.round(e.dmg-S.arm));
      P.hp-=d;
      floats.push({x:P.x,y:P.y-22,txt:'-'+d,c:'#ff9a9a',life:.7});
      rings.push({x:P.x,y:P.y,r:P.r,max:P.r+20,c:'#ff6b6b',life:.2});
      if(P.hp<=0){ P.hp=0; state='over'; return; }
    }
  }

  // 子弹
  for(const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    for(const e of enemies){
      if(e.hp<=0||e.spawnT>0||b.hit.includes(e)) continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        b.hit.push(e);
        const dmg=b.dmg;
        if(b.aoe){
          for(const o of enemies){ if(o.hp>0&&o.spawnT<=0&&Math.hypot(o.x-b.x,o.y-b.y)<b.aoe){
            o.hp-=dmg; o.hitT=.12;
            floats.push({x:o.x,y:o.y-14,txt:''+Math.round(dmg),c:'#fff0b8',life:.5}); } }
          rings.push({x:b.x,y:b.y,r:6,max:b.aoe,c:b.c,life:.22});
        }else{
          e.hp-=dmg; e.hitT=.12;
          floats.push({x:e.x,y:e.y-14,txt:''+Math.round(dmg),c:'#fff0b8',life:.5});
        }
        if(b.pierce>0) b.pierce--; else b.life=0;
        break;
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>AR.x-60&&b.x<AR.x+AR.w+60&&b.y>AR.y-60&&b.y<AR.y+AR.h+60);

  // 死亡掉金币
  for(const e of enemies){
    if(e.hp<=0&&!e.dead){
      e.dead=true; kills++;
      for(let i=0;i<e.gold;i++)
        coins.push({x:e.x+(Math.random()-.5)*14,y:e.y+(Math.random()-.5)*14});
      rings.push({x:e.x,y:e.y,r:4,max:e.r+16,c:e.c,life:.24});
    }
  }
  enemies=enemies.filter(e=>e.hp>0);

  // 金币：近处吸得快，远处也会慢慢飘过来
  for(const c of coins){
    const dx=P.x-c.x,dy=P.y-c.y,l=Math.hypot(dx,dy)||1;
    const v=l<pickupR()?420:70;
    c.x+=dx/l*v*dt; c.y+=dy/l*v*dt;
    if(l<P.r+7){ c.got=true; gold+=1;
      floats.push({x:P.x,y:P.y-30,txt:'+1',c:'#f7d24e',life:.45}); }
  }
  coins=coins.filter(c=>!c.got);

  floats.forEach(f=>{f.y-=34*dt;f.life-=dt;}); floats=floats.filter(f=>f.life>0);
  rings.forEach(r=>{r.r+=(r.max-r.r)*Math.min(1,dt*14);r.life-=dt;}); rings=rings.filter(r=>r.life>0);

  waveT+=dt;
  if(waveT>=waveLen) endWave();
}

// ---------------- 波次 / 补给站 ----------------
function endWave(){
  gold+=coins.length; coins=[];                  // 剩下的金币全部结算
  gold+=10+wave*4;                               // 通关奖励
  P.hp=Math.min(P.maxHp,P.hp+Math.round(P.maxHp*.12)); // 每波回一点血
  enemies=[];bullets=[];rrCount=0;
  state='shop'; rollOffers();
}
function weaponAvail(def){
  if(weapons.length<MAXSLOT) return true;
  return weapons.some(w=>w.key===def.key&&w.lv<MAXLV);
}
function rollOffers(){
  offers=[]; const pool=[];
  for(const w of WEAPONS) if(weaponAvail(w)) pool.push({type:'w',def:w,cost:w.cost});
  for(const u of UPGRADES) pool.push({type:'u',def:u,cost:u.cost});
  for(let i=0;i<4&&pool.length;i++){
    const k=Math.floor(Math.random()*pool.length);
    offers.push(pool[k]); pool.splice(k,1);
  }
}
function rerollCost(){ return 3+rrCount*2; }
function reroll(){
  if(gold<rerollCost()) return false;
  gold-=rerollCost(); rrCount++; rollOffers(); return true;
}
function buyOffer(i){
  const o=offers[i]; if(!o||o.bought||gold<o.cost) return false;
  gold-=o.cost; o.bought=true;
  if(o.type==='w'){
    const ex=weapons.find(w=>w.key===o.def.key&&w.lv<MAXLV);
    if(ex){ ex.lv++; ex.dmg=Math.round(ex.dmg*1.30); ex.cd=+(ex.cd*.93).toFixed(3); }
    else weapons.push({...o.def,lv:1,cdL:0});
  } else o.def.apply();
  return true;
}
function nextWave(){ wave++; waveT=0; waveLen=20; state='play'; spawnAcc=0; }

// ---------------- 绘制 ----------------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=W; cv.height=H;
function fit(){
  const wrap=document.getElementById('wrap');
  const s=Math.min((wrap.clientWidth-4)/W,(wrap.clientHeight-4)/H);
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,200));

function rr(x,y,w,h,r){ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);}
function fill(x,y,w,h,r,c){rr(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill();}
function grad(x,y,w,h,a,b){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function txt(s,x,y,size,color,align){
  ctx.fillStyle=color||'#efe7dc';
  ctx.font='700 '+size+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y);
}
let OFR=[];
function draw(){
  ctx.fillStyle='#0d0b0a'; ctx.fillRect(0,0,W,H);

  fill(AR.x,AR.y,AR.w,AR.h,10,grad(AR.x,AR.y,AR.w,AR.h,'#211c17','#171310'));
  ctx.save(); ctx.globalAlpha=.10; ctx.strokeStyle='#e7a14a'; ctx.lineWidth=1;
  for(let x=AR.x;x<AR.x+AR.w;x+=43){ctx.beginPath();ctx.moveTo(x,AR.y);ctx.lineTo(x,AR.y+AR.h);ctx.stroke();}
  for(let y=AR.y;y<AR.y+AR.h;y+=43){ctx.beginPath();ctx.moveTo(AR.x,y);ctx.lineTo(AR.x+AR.w,y);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='#e7a14a'; ctx.lineWidth=3; rr(AR.x,AR.y,AR.w,AR.h,10); ctx.stroke();

  drawHUD();
  for(const c of coins) circ(c.x,c.y,5,'#f7d24e');
  for(const r of rings){ ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,r.life*4));
    ctx.strokeStyle=r.c; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); ctx.restore(); }
  if(state==='play'){
    const tg=nearestEnemy(99999);
    if(tg){ ctx.save(); ctx.globalAlpha=.20; ctx.strokeStyle='#f7d24e'; ctx.lineWidth=1.5;
      ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(tg.x,tg.y);
      ctx.stroke(); ctx.restore(); }
  }
  for(const t of trail){ ctx.save(); ctx.globalAlpha=t.life*1.1;
    circ(t.x,t.y,P.r*.85,'#3a332b'); ctx.restore(); }
  for(const e of enemies) drawEnemy(e);
  for(const b of bullets){
    circ(b.x,b.y,b.r,b.c);
    ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle=b.c; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*.03,b.y-b.vy*.03); ctx.stroke(); ctx.restore();
  }
  if(state==='play') drawPlayer();
  for(const f of floats){ ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));
    txt(f.txt,f.x,f.y,15,f.c,'center'); ctx.restore(); }

  drawSlots();
  if(state==='start') drawStart();
  if(state==='shop')  drawShop();
  if(state==='over')  drawOver();
  if(joy&&state==='play') drawJoy();
}
function drawHUD(){
  fill(14,14,300,24,12,'#2b241d');
  fill(16,16,Math.max(0,296*P.hp/P.maxHp),20,10,'#5cc98a');
  txt(P.hp+'/'+P.maxHp,164,26,13,'#15120e','center');
  txt('第 '+wave+' 波',346,26,17,'#e7a14a','center');
  txt(Math.max(0,Math.ceil(waveLen-waveT))+'s',452,26,15,'#c3b6a4','center');
  txt('金币 '+gold,W-14,52,17,'#f7d24e','right');
  txt('击杀 '+kills,14,52,14,'#8a7c6b');
  if(S.arm>0) txt('护甲 '+S.arm,120,52,14,'#9fd6f2');
}
function drawPlayer(){
  const tilt=Math.max(-.26,Math.min(.26,P.vx/Math.max(1,spd())*.30));
  weapons.forEach((w,i)=>{
    const a=tick*.9+i*(6.2831/Math.max(1,weapons.length));
    const wx=P.x+Math.cos(a)*34, wy=P.y+Math.sin(a)*34;
    circ(wx,wy,11,'rgba(20,16,12,.85)');
    ctx.save(); ctx.translate(wx,wy); ctx.scale(.30,.30);
    ctx.fillStyle=w.c; ctx.strokeStyle=w.c; ctx.lineWidth=9; ctx.lineCap='round';
    weaponShape(w.key); ctx.restore();
    if(w.lv>1){ circ(wx+9,wy+9,7,'#1b1611'); txt(''+w.lv,wx+9,wy+9,9,'#f7d24e','center'); }
  });
  ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(tilt);
  circ(0,0,P.r+3,'rgba(0,0,0,.35)');
  circ(0,0,P.r,'#f2e2c4');
  circ(-5,-4,3,'#2b241d'); circ(5,-4,3,'#2b241d');
  ctx.strokeStyle='#2b241d'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,3,6,.25,2.9); ctx.stroke();
  ctx.restore();
}
function weaponShape(k){
  ctx.beginPath();
  if(k==='pistol'){ ctx.fillRect(-6,-4,20,9); ctx.fillRect(-12,0,10,6); }
  else if(k==='smg'){ ctx.fillRect(-8,-5,26,10); ctx.fillRect(-16,1,12,5); }
  else if(k==='shotgun'){ ctx.fillRect(-8,-7,26,6); ctx.fillRect(-8,1,26,6); }
  else if(k==='bow'){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=7;
    ctx.arc(0,0,20,-1.2,1.2); ctx.stroke(); ctx.beginPath();
    ctx.moveTo(-4,-16); ctx.lineTo(-4,16); ctx.stroke(); }
  else if(k==='staff'){ ctx.fillRect(-3,-24,6,42); ctx.beginPath(); ctx.arc(0,-26,8,0,7); ctx.fill(); }
  else if(k==='rocket'){ ctx.fillRect(-10,-9,30,18); ctx.beginPath();
    ctx.moveTo(20,-9); ctx.lineTo(30,0); ctx.lineTo(20,9); ctx.closePath(); ctx.fill(); }
}
function drawEnemy(e){
  const c=e.hitT>0?'#ffffff':e.c;
  ctx.save();
  if(e.spawnT>0){
    ctx.globalAlpha=.35+.35*Math.sin(tick*18);
    circ(e.x,e.y,e.r+6,'rgba(255,255,255,.25)');
  }
  if(e.t==='grunt'){
    circ(e.x,e.y,e.r,c); ctx.fillStyle=c;
    for(let i=0;i<6;i++){ const a=i*1.047+tick*.6;
      ctx.beginPath();
      ctx.moveTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r);
      ctx.lineTo(e.x+Math.cos(a+.26)*(e.r+6),e.y+Math.sin(a+.26)*(e.r+6));
      ctx.lineTo(e.x+Math.cos(a-.26)*(e.r+6),e.y+Math.sin(a-.26)*(e.r+6));
      ctx.closePath(); ctx.fill(); }
  } else if(e.t==='fast'){
    const a=Math.atan2(P.y-e.y,P.x-e.x);
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(e.r+5,0); ctx.lineTo(-e.r,-e.r*.8);
    ctx.lineTo(-e.r*.4,0); ctx.lineTo(-e.r,e.r*.8); ctx.closePath();
    ctx.fillStyle=c; ctx.fill(); ctx.restore();
  } else {
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=i*1.047+.5;
      const px=e.x+Math.cos(a)*e.r, py=e.y+Math.sin(a)*e.r;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fillStyle=c; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=4; ctx.stroke();
  }
  ctx.restore();
  if(e.hp<e.maxHp){
    fill(e.x-14,e.y-e.r-11,28,4,2,'rgba(0,0,0,.6)');
    fill(e.x-13,e.y-e.r-10,Math.max(0,26*e.hp/e.maxHp),2,1,'#ff8f8f');
  }
}
function drawJoy(){
  ctx.save();
  ctx.globalAlpha=.16; circ(joy.ox,joy.oy,JR,'#e7a14a');
  ctx.globalAlpha=.45; ctx.strokeStyle='#e7a14a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(joy.ox,joy.oy,JR,0,7); ctx.stroke();
  ctx.globalAlpha=.20; ctx.beginPath(); ctx.moveTo(joy.ox,joy.oy);
  ctx.lineTo(joy.x,joy.y); ctx.lineWidth=14; ctx.lineCap='round'; ctx.stroke();
  ctx.globalAlpha=.62; circ(joy.x,joy.y,21,'#f7d24e');
  ctx.restore();
}

}

function drawShop(){
  ctx.fillStyle='rgba(8,7,6,.93)'; ctx.fillRect(0,0,W,H);
  txt('第 '+wave+' 波结束 · 补给站',W/2,112,25,'#e7a14a','center');
  txt('金币 '+gold,W/2,152,21,'#f7d24e','center');

      txt(o.def.tip,x+w/2,y+122,11,can?'#8a7c6b':'#5d5449','center');

  });
  txt('武器槽 '+weapons.length+'/'+MAXSLOT+'　伤害 +'+Math.round(S.dmg*100)+
      '%　攻速 +'+Math.round(S.rate*100)+'%　护甲 '+S.arm,W/2,552,13,'#8a7c6b','center');
  const rc=rerollCost(), rCan=gold>=rc;

// ---------------- 输入 ----------------
function toCanvas(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('pointerdown',e=>{
  const p=toCanvas(e);
  if(state==='start'||state==='shop'||state==='over'){
    for(const o of OFR){
      if(p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h){
        if(o.kind==='start'){ state='play'; return; }
        if(o.kind==='restart'){ reset(); state='play'; return; }
        if(o.kind==='go'){ nextWave(); return; }
        if(o.kind==='reroll'){ reroll(); return; }
        if(o.kind==='offer'){ buyOffer(o.i); return; }
      }
    }
    return;
  }
  joy={ox:p.x,oy:p.y,x:p.x,y:p.y,id:e.pointerId};
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
});
// 浮点摇杆：手指推出半径后原点跟着走，变向不需要先回中（这是"变向延迟"的主因）
function joyMove(e){
  if(!joy||e.pointerId!==joy.id) return;
  const p=toCanvas(e);
  let dx=p.x-joy.ox, dy=p.y-joy.oy;
  const l=Math.hypot(dx,dy);
  if(l>JR){ joy.ox=p.x-dx/l*JR; joy.oy=p.y-dy/l*JR; }
  joy.x=p.x; joy.y=p.y;          // 摇杆头永远贴在手指上，视觉零延迟
}
cv.addEventListener('pointermove',joyMove,{passive:true});
// Chrome/Edge 的未合并原始事件，能把输入延迟再降一帧
try{ cv.addEventListener('pointerrawupdate',joyMove,{passive:true}); }catch(_){}
function endJoy(e){ if(joy&&(!e||e.pointerId===joy.id)) joy=null; }
cv.addEventListener('pointerup',endJoy);
cv.addEventListener('pointercancel',endJoy);
window.addEventListener('keydown',e=>{
  if(e.key==='a'||e.key==='ArrowLeft')keys.l=1;
  if(e.key==='d'||e.key==='ArrowRight')keys.r=1;
  if(e.key==='w'||e.key==='ArrowUp')keys.u=1;
  if(e.key==='s'||e.key==='ArrowDown')keys.d=1;
});
window.addEventListener('keyup',e=>{
  if(e.key==='a'||e.key==='ArrowLeft')keys.l=0;
  if(e.key==='d'||e.key==='ArrowRight')keys.r=0;
  if(e.key==='w'||e.key==='ArrowUp')keys.u=0;
  if(e.key==='s'||e.key==='ArrowDown')keys.d=0;
});

// ---------------- 主循环 ----------------
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  step(dt); draw(); requestAnimationFrame(loop);
}
reset(); fit(); requestAnimationFrame(loop);

// 测试钩子
window.__G={AR,MAXSLOT,MAXLV,
  get P(){return P},get S(){return S},get enemies(){return enemies},get bullets(){return bullets},
  get weapons(){return weapons},get gold(){return gold},get wave(){return wave},
  get state(){return state},get kills(){return kills},get coins(){return coins},
  reset,step,spawnEnemy,fire,buyOffer,reroll,rerollCost,nextWave,endWave,rollOffers,nearestEnemy,draw,
  get keys(){return keys},get offers(){return offers},
  setWave(w){wave=w},setGold(g){gold=g},setState(s){state=s},OFR:()=>OFR};
</script>
